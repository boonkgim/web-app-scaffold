name: Bug report
description: Something in the scaffold does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't use this form for security vulnerabilities —
        see [SECURITY.md](https://github.com/boonkgim/web-app-scaffold/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead. Paste the actual output.
      placeholder: |
        Ran `pnpm --filter @web-app-scaffold/db migrate` and got:
        Error: connect ECONNREFUSED 127.0.0.1:5434
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: From a fresh clone if you can — that is the case the scaffold has to get right.
      placeholder: |
        1. git clone … && pnpm install
        2. cp the three .env.example files
        3. docker compose up -d --wait
        4. pnpm --filter @web-app-scaffold/db migrate
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      multiple: true
      options:
        - apps/web (Next.js)
        - apps/graphql (GraphQL Worker)
        - packages/db (Drizzle / Postgres)
        - packages/email (React Email / Resend)
        - Auth (Better Auth)
        - Payments (Stripe)
        - Local setup / Docker
        - Deployment (Cloudflare / Neon)
        - docs/setup or docs:check
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `node -v`, `pnpm -v`, `docker --version`, and your OS.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the relevant `.env.example` rather than copying it blind
        - label: I checked `docker compose ps` if this involves the local stack
