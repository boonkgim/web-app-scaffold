packages:
  - "apps/*"
  - "packages/*"

# GHSA-67mh-4wv8-2f99: esbuild <= 0.24.2 lets any website send requests to
# `esbuild serve`'s dev server and read the response. It reaches this repo only through
# drizzle-kit -> @esbuild-kit/core-utils, a deprecated package drizzle-kit still declares
# beside its own modern esbuild, and which pins esbuild 0.18. Nothing here runs
# `esbuild serve`, so it was never exploitable -- but a standing alert nobody can act on
# is how an alert list turns into wallpaper.
#
# Scoped to that one parent, NOT a bare `esbuild:` override: wrangler and vite resolve
# their own esbuild and must keep doing so. Drop it when drizzle-kit drops @esbuild-kit;
# pnpm reports an override that matches nothing, so it cannot rot silently.
overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"

# Postinstall scripts are blocked by default (supply-chain hardening). These two
# fetch/link platform binaries and must run: workerd is the Workers runtime behind
# `wrangler dev` and `opennextjs-cloudflare preview`; esbuild is wrangler's bundler.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  unrs-resolver: false

# One version of shared tooling across every package. Packages write
# "typescript": "catalog:" and the version is resolved from here.
#
# Verify all three before running this slice — they are the pins most likely to
# have moved, and two of the three moved between writing this and last checking it.
#
# TypeScript is held at 6.x, NOT the 7.x native port: typescript-eslint 8.69.0
# still declares `typescript: ">=4.8.4 <6.1.0"` and hard-errors ("typescript-eslint
# does not support TS 7.0") rather than warning, which takes the shared ESLint base —
# and so `pnpm lint` in every package — down with it. tsc and `next build` are
# both fine on 7; ESLint is the sole blocker. npm's `latest` for typescript is 7.x,
# so a bare `pnpm add -D typescript` lands on the broken side and the catalog pin
# is what pulls it back — you will see it do exactly that on `pnpm install`.
# Revisit when typescript-eslint ships TS >= 6.1 support:
# https://github.com/typescript-eslint/typescript-eslint/issues/10940
#
# ESLint is 10.x. 9.x is deprecated on npm ("no longer supported") and installing it
# prints that on every run; typescript-eslint 8.69.0 peers
# `eslint: ^8.57.0 || ^9.0.0 || ^10.0.0`, so nothing holds this back. @eslint/js
# follows eslint's major and is installed unpinned below, which is why it needs no
# catalog entry.
#
# @types/node tracks the runtime in .nvmrc / engines (Node 24), not whatever
# create-next-app happened to scaffold. It drifts to ^20 otherwise — four majors
# behind the runtime, which under-declares newer APIs and mistypes changed ones.
# Track the newest release of the Node major this repo runs, not npm's `latest`:
# @types/node ships majors for Node versions you are not on.
#
# react/react-dom are exact, not ranged: apps/web takes what Next pinned and
# packages/email must match it. Two resolutions means two React copies, which
# renders nothing and explains nothing.
#
# better-auth and its CLI are one release train, versioned in lockstep upstream.
# The CLI is here despite having one installer because a CLI that generates tables
# for a different version than the runtime reads produces a migration that applies
# cleanly and a sign-in that fails.
#
# There is deliberately no @better-auth/drizzle-adapter entry. better-auth depends
# on it at an exact pin and re-exports it as better-auth/adapters/drizzle, so a
# second ranged entry here would drift away from the copy core actually uses.
catalog:
  typescript: ^6.0.3
  eslint: ^10.10.0
  "@types/node": ^24.13.3
  react: 19.2.8
  react-dom: 19.2.8
  better-auth: ^1.7.3
  auth: ^1.7.3

# Written by pnpm itself, not by hand. pnpm 11 holds a release-age cooldown on new
# versions and records the ones an install accepted anyway; `pnpm add` appends here
# and prints what it added. It is committed because it is real resolution state a
# fresh clone must reproduce — and it is in this doc rather than baselined in
# docs-check.ignore because, unlike wrangler.jsonc's account-specific ids, these
# values are the same for anyone installing better-auth 1.7.3. Expect the next slice
# that adds a dependency to extend it, and amend this hunk when it does.
minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.3"
  - "@better-auth/drizzle-adapter@1.7.3"
  - "@better-auth/kysely-adapter@1.7.3"
  - "@better-auth/memory-adapter@1.7.3"
  - "@better-auth/mongo-adapter@1.7.3"
  - "@better-auth/prisma-adapter@1.7.3"
  - "@better-auth/telemetry@1.7.3"
  - better-auth@1.7.3
  - auth@1.7.3
